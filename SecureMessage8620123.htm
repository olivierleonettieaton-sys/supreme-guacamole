  <style>
  :root {
    --primary-color: #2563eb;
    --primary-hover: #1d4ed8;
    --bg-color: #f8fafc;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --error-red: #ef4444;
    --error-bg: #fef2f2;
    --error-border: #fee2e2;
    --bg-overlay: rgba(15, 23, 42, 0.1);
    --card-shadow:
      0 10px 25px -5px rgba(0, 0, 0, 0.1),
      0 8px 10px -6px rgba(0, 0, 0, 0.1);
  }

  body {
    margin: 0;
    height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url("https://i.postimg.cc/k5wF8Zxz/index.png");
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .login-container {
    z-index: 99;
    opacity: 0;
    background: #ffffff;
    padding: 40px;
    border-radius: 16px;
    box-shadow: var(--card-shadow);
    max-width: 420px;
    width: 100%;
    box-sizing: border-box;
    text-align: center;
    transform: scale(0.95);
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease-out;
  }

  .page-loaded {
    transform: scale(1);
    opacity: 1;
  }

  .hidden {
    display: none !important;
  }

  #favi {
    width: 48px;
    height: 48px;
    margin-bottom: 20px;
    border-radius: 8px;
  }

  h2.info {
    margin: 0 0 8px 0;
    color: var(--text-main);
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.025em;
  }

  .para {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 24px;
  }

  /* --- Status/Error Box Styling --- */
  .status-box {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px;
    background-color: var(--error-bg);
    border: 1px solid var(--error-border);
    border-radius: 10px;
    margin-bottom: 24px;
    text-align: left;
    color: var(--error-red);
  }

  .status-icon {
    font-size: 1.2rem;
    margin-top: 2px;
  }

  .status-message strong {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .status-message p {
    font-size: 0.85rem;
    margin: 0;
    line-height: 1.4;
    color: #b91c1c;
  }

  /* --- Form Styling --- */
  .input-group {
    margin-bottom: 16px;
    text-align: left;
  }

  .input-group input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 1rem;
    background-color: #fff;
    box-sizing: border-box;
    transition: all 0.2s ease;
  }

  .input-group input:disabled {
    background-color: #f8fafc;
    color: var(--text-muted);
    border-color: #f1f5f9;
    cursor: not-allowed;
  }

  .input-group input:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
  }

  /* --- Button & Loader Styling --- */
  .sign-in-btn {
    position: relative;
    width: 100%;
    padding: 12px;
    background-color: var(--primary-color);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 48px;
  }

  .sign-in-btn:hover:not(:disabled) {
    background-color: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
  }

  .sign-in-btn:disabled {
    background-color: #94a3b8;
    cursor: not-allowed;
    opacity: 0.8;
  }

  .loader {
    width: 20px;
    height: 20px;
    border: 2.5px solid rgba(255, 255, 255, 0.3);
    border-top: 2.5px solid #ffffff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* --- Shake Animation --- */
  .shake-anim {
    animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
  }

  @keyframes shake {
    10%, 90% { transform: translate3d(-1px, 0, 0); }
    20%, 80% { transform: translate3d(2px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
    40%, 60% { transform: translate3d(4px, 0, 0); }
  }

  @media (max-width: 480px) {
    .login-container {
      padding: 30px 20px;
      box-shadow: none;
      background: #ffffff; /* Keep bg white for mobile readability */
      max-width: 90%;
    }
    body {
      background: var(--bg-color);
    }
  }
